<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post</title>
    <style>
        body {
            margin: 0;
            font-family: New Century Schoolbook, TeX Gyre Schola, serif;
            background-image: url("/helpers/background_spit.png");
            background-size: cover;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-size: 800% 800%;
            animation: gradientMove 30s ease-in-out infinite;
        }
        @keyframes gradientMove {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        h1 {
            margin-top: 40px;
            letter-spacing: 2px;
        }

        .form-container {
            background-color: #1c1c1c;
            padding: 30px;
            margin-top: 30px;
            border-radius: 12px;
            width: 350px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
        }

        .form-container textarea {
            width: 100%;
            height: 100px;
            resize: none;
            border-radius: 8px;
            border: none;
            outline: none;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .form-container input[type="file"] {
            margin-bottom: 20px;
            color: white;
        }

        .form-container button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background-color: rgb(50,0,0);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .form-container button:hover {
            background-color: rgb(100,0,0);
        }


        #preview {
            text-align: center;
            margin: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

    </style>
</head>

<body>
    <h1>SOCIAL POST-IT</h1>

    <div class="form-container">
        <form action="/post" method="post" enctype="multipart/form-data">
            <input type="file" name="image" id="imageInput" accept="image/*" />

            <textarea name="description" placeholder="Write..."></textarea>

            <img id="preview" src="" alt="Preview" style="display:none; max-width:300px; margin-top:10px;" />

            <button type="submit">Post</button>
        </form>
    </div>

    <script>
        const input = document.getElementById('imageInput');
        const preview = document.getElementById('preview');

        input.addEventListener('change', () => {
            const file = input.files[0];
            if (!file) return;

            preview.src = URL.createObjectURL(file);
            preview.style.display = 'block';
        });
    </script>
</body>
</html>
