<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post</title>
    <style>
        body {
            margin: 0;
            font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            background-image: url("/helpers/background_spit.png");
            background-size: cover;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-top: 40px;
            letter-spacing: 2px;
        }

        .form-container {
            background-color: #1c1c1c;
            padding: 30px;
            margin-top: 30px;
            border-radius: 12px;
            width: 350px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
        }

        .form-container textarea {
            width: 100%;
            height: 100px;
            resize: none;
            padding: 10px;
            border-radius: 8px;
            border: none;
            outline: none;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .form-container input[type="file"] {
            margin-bottom: 20px;
            color: white;
        }

        .form-container button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background-color: rgb(50,0,0);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .form-container button:hover {
            background-color: rgb(100,0,0);
        }
    </style>
</head>

<body>
    <h1>SOCIAL POST-IT</h1>

    <div class="form-container">
        <form action="/post" method="post" enctype="multipart/form-data">
            <textarea name="description" placeholder="Write..."></textarea>

            <input type="file" name="image" />

            <button type="submit">Post</button>
        </form>
    </div>
</body>
</html>
