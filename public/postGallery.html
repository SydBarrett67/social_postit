<!DOCTYPE html>
<html>
<head>
    <title>Gallery - Social Post-It</title>
    <style>
        body {
            margin: 0;
            font-family: New Century Schoolbook, TeX Gyre Schola, serif;
            background-image: url("/helpers/background_spit.png");
            background-size: cover;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-size: 800% 800%;
            animation: gradientMove 30s ease-in-out infinite;
        }
        @keyframes gradientMove {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        h1 {
            margin: 40px 0 20px 0;
            letter-spacing: 2px;
        }

        .gallery {
            width: 90%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }

        .card {
            background-color: #1c1c1c;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.03);
        }

        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        .empty {
            margin-top: 50px;
            opacity: 0.6;
        }
    </style>
</head>

<body>

    <h1>POST GALLERY</h1>

    <div class="gallery" id="gallery"></div>

    <script>
        fetch('/api/posts')
        .then(res => res.json())
        .then(posts => {
            const gallery = document.getElementById('gallery');

            if (posts.length === 0) {
                gallery.innerHTML = "<p class='empty'>Empty post gallery.</p>";
                return;
            }

            posts.forEach(post => {
                const card = document.createElement('div');
                card.className = "card";

                const img = document.createElement('img');
                img.src = post.image ? `/images/${post.image}` : '';

                const desc = document.createElement('div');
                desc.style.padding = "15px";
                desc.style.fontSize = "14px";
                desc.style.opacity = "0.85";
                desc.textContent = post.description;

                card.appendChild(img);
                card.appendChild(desc);
                gallery.appendChild(card);
            });
        })
        .catch(console.error);
    </script>

</body>
</html>
