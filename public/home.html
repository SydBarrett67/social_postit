<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="/style/home.css">
</head>
<body>

    <!-- Left side-bar -->
    <div class="sidebar">
        <h2>Home</h2>
        <ul>
            <li><a href="/profile">Profile</a></li>
            <li><a href="/post">Create Post</a></li>
            <li><a href="/postGallery">View Posts</a></li>
        </ul>
    </div>

    <!-- Main wrapper -->
    <div class="container">
        <div class="main-content">

            <!-- Search bar -->
            <div class="search-bar">
                <input
                    type="search"
                    placeholder="Search..."
                    aria-label="Search posts"
                />
            </div>

            <h1>Discover.</h1>
        </div>
    </div>

    <!-- Top right controls -->
    <div class="top-controls" id="topControls" style="display:none;">
        <div class="profile-wrapper">
            <div class="profile-avatar" id="avatar"></div>
        </div>

        <button class="hamburger-btn" aria-label="Open menu">
            ☰
        </button>
    </div>

    <!-- Hamburger menu -->
    <div class="hamburger_menu">
        <button class="nav-button" onclick="location.href='/profile'">Profile</button>
        <button class="nav-button" onclick="location.href='/postGallery'">View Posts</button>
    </div>


    <script>
        const btn = document.querySelector('.hamburger-btn');
        const menu = document.querySelector('.hamburger_menu');

        fetch('/api/me')
            .then(res => res.json())
            .then(data => {
                if (!data.logged) return;

                const topControls = document.getElementById('topControls');
                const avatar = document.getElementById('avatar');

                avatar.textContent = data.username.charAt(0).toUpperCase();
                avatar.onclick = () => location.href = '/profile';

                topControls.style.display = 'flex';

                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    menu.classList.toggle('active');
                    avatar.classList.toggle('pulse');
                });

                document.addEventListener('click', (e) => {
                    if (!menu.contains(e.target) && !btn.contains(e.target)) {
                        menu.classList.remove('active');
                        avatar.classList.remove('pulse');
                    }
                });
            });
    </script>

</body>
</html>
